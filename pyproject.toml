[project]
name = "mailsync"
version = "0.1.0"
description = "One-way IMAP Inbox copier"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mailsync = "mailsync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailsync = ["migrations/*.sql"]
